name: Auto Update SmartTube APK

on:
  schedule:
    # Chạy tự động lúc 0h00 UTC mỗi ngày (khoảng 7h00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  # Cho phép bạn bấm nút chạy thủ công bất kỳ lúc nào để test
  workflow_dispatch:

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK and Rename
        run: |
          # URL tải app
          URL="https://r2-apk.daivietpda.com/payload/cobalt-smarttube-beta-android56.apk"
          
          # Tên file mới theo yêu cầu
          FILENAME="SmartTube For Android 5/6 -2648436.apk"
          
          # Tải file về và ghi đè/đổi tên
          curl -L -o "$FILENAME" "$URL"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Thêm file vào Git
          git add "SmartTube For Android 5/6 -2648436.apk"
          
          # Kiểm tra nếu có sự thay đổi mới commit
          if git status --porcelain | grep -q .; then
            git commit -m "Auto update SmartTube APK [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "File APK không có sự thay đổi mới."
          fi
