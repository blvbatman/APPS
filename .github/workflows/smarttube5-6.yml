name: Auto Update SmartTube APK

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK and Rename
        run: |
          URL="https://r2-apk.daivietpda.com/payload/cobalt-smarttube-beta-android56.apk"
          # Đã đổi 5/6 thành 5-6 để tránh lỗi hệ thống Linux
          FILENAME="SmartTube For Android 5-6 -2648436.apk"
          
          curl -L -o "$FILENAME" "$URL"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "SmartTube For Android 5-6 -2648436.apk"
          
          if git status --porcelain | grep -q .; then
            git commit -m "Auto update SmartTube APK [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "File APK không có sự thay đổi mới."
          fi
