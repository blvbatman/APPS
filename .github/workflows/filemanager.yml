name: Auto Update File Manager APK

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK and Rename
        run: |
          URL="https://tinhlagi.pro/app/?download=4baa129791c9772fe7b3615754059b17dfd6cb6298190596c70f4ef4832ad6f9"
          FILENAME="File Manager-6293343.apk"
          
          curl -sSLk -f -o "$FILENAME" "$URL"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          FILENAME="File Manager-6293343.apk"
          git add "$FILENAME"
          
          if git status --porcelain | grep -q .; then
            git commit -m "Auto update SmartTube APK [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "File APK không có sự thay đổi mới."
          fi
