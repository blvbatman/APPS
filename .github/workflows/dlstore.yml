name: Auto Update DLStore APK

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK and Rename
        run: |
          URL="https://download2330.mediafire.com/i627d2jz88dgrMlSw-gt1_NY1Pp4s87wRwNC6zj7ibNHMcPTM3wg0jt1wxaO5SsCVDSXgHRvLFHo9e6zMT6HLOy8JTZ0eCicZg1mzoGGfjxZkmcNlslS2lqW_gXI-44vxtBpbz0UJ06zA7gnOXQZq3lShTtTNJJ0SFftryz8LfAQQ0Y/jeec7t5kbwsqz9e/DLStore_v16.0.5.apk"
          FILENAME="DLStore-3199886.apk"
          
          curl -sSLk -f -o "$FILENAME" "$URL"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          FILENAME="DLStore-3199886.apk"
          git add "$FILENAME"
          
          if git status --porcelain | grep -q .; then
            git commit -m "Auto update SmartTube APK [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "File APK không có sự thay đổi mới."
          fi
